services:
  db:
    image: postgres:16-alpine
    container_name: queue-notify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: queuenotify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - queue-notify-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queue-notify-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/queuenotify
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      STAFF_USERNAME: ${STAFF_USERNAME:-staff}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Set STAFF_PASSWORD (at least 12 characters)}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-push-demo}
    ports:
      - "8080:8080"

volumes:
  queue-notify-db-data:
