server:
  port: ${PORT:8080}

spring:
  application:
    name: queue-notify
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queuenotify}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate # โครงสร้างตารางคุมด้วย Flyway เท่านั้น ห้ามให้ Hibernate สร้างเอง
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

notification:
  line:
    access-token: ${LINE_ACCESS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
