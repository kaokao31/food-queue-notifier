<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR หน้าร้าน · พร้อมรับ</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header class="topbar"><a class="brand" href="/">▤ พร้อมรับ</a><a href="/staff">กลับหน้าพนักงาน</a><form action="/staff/logout" method="post"><input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" disabled th:disabled="${_csrf == null}">ออกจากระบบ</button></form></header><main class="qr-main"><section class="panel no-print"><p class="eyebrow">SCAN TO ORDER</p><h1>QR สำหรับวางบนโต๊ะ</h1><p>ใส่ URL HTTPS ของเว็บที่ deploy แล้ว ตรวจว่าโทรศัพท์เปิดได้ก่อนพิมพ์</p><form id="qr-form"><label>URL หน้าเมนู<input id="qr-url" type="url" maxlength="1000" placeholder="https://ชื่อเว็บ.onrender.com/" required></label><button disabled class="primary">สร้าง QR</button></form><p id="qr-error" class="error" role="status"></p></section><section id="qr-card" class="panel qr-card" hidden><p class="eyebrow">พร้อมรับ · FOOD &amp; QUEUE</p><h2>สแกน เลือกอาหาร รับเลขคิว</h2><img id="qr-image" alt="QR เปิดหน้าเมนูอาหาร" width="320" height="320"><p id="qr-link"></p><p>ไม่ต้องกรอกชื่อหรือเบอร์โทร<br>เปิดแจ้งเตือนบน Android เพื่อรับข่าวเมื่ออาหารพร้อม</p><button disabled id="print-qr" class="primary no-print">พิมพ์ QR</button></section></main></body></html>
