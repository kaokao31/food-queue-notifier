<section class="section-head"><div><p class="eyebrow">MENU MANAGEMENT</p><h1>เมนูอร่อยของร้าน</h1><p class="muted">เมนูที่เคยถูกสั่งแล้วให้ปิดขายแทนการลบ</p></div><button id="new-menu" class="primary">+ เพิ่มเมนู</button></section><div id="admin-menu" class="menu-grid"></div><div class="pager"><button id="prev">ก่อนหน้า</button><span id="page-info"></span><button id="next">ถัดไป</button></div><dialog id="menu-dialog"><form id="menu-form"><h2 id="form-title">เพิ่มเมนู</h2><input type="hidden" name="id"><label>ชื่อเมนู<input name="name" maxlength="100" required></label><label>ภาพเมนู<input name="image" id="menu-image" type="file" accept="image/jpeg,image/png"><span class="muted small">เลือก JPG หรือ PNG ขนาดไม่เกิน 2 MB · หากไม่เลือก จะใช้ภาพเดิมหรือภาพตัวอย่าง</span></label><img id="menu-image-preview" class="menu-image-preview" alt="ตัวอย่างภาพเมนู" hidden><label>หมวดหมู่<input name="category" maxlength="50"></label><div class="form-row"><label>ราคา (บาท)<input name="price" type="number" min="0" max="99999999.99" step="0.01" required></label><label>เวลาปรุง (นาที)<input name="prepTimeMinutes" type="number" min="0" max="240"></label></div><label class="check"><input name="isAvailable" type="checkbox" checked> เปิดขาย</label><p id="form-error" class="error"></p><div class="actions"><button id="delete-menu" type="button" class="danger" hidden>ลบเมนู</button><button type="button" onclick="this.closest('dialog').close()">ยกเลิก</button><button class="primary">บันทึกเมนู</button></div></form></dialog>
