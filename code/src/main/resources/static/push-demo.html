<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบ Web Push</title><script src="/assets/push-demo.js" defer></script></head>
<body><main><h1>ทดสอบ Web Push สำหรับ STAFF</h1>
<p>ทดสอบแยกจากออเดอร์และประวัติแจ้งเตือน ข้อมูลสมัครเก็บชั่วคราว 15 นาทีใน session นี้</p>
<p>ใช้ Chrome กับ HTTPS หรือ localhost และตั้งค่า VAPID ให้ครบ การตอบรับจาก provider ยังไม่ยืนยันว่าอุปกรณ์แสดงข้อความ</p>
<button id="register">อนุญาตและสมัครรับข้อความทดสอบ</button>
<button id="send">ส่งข้อความทดสอบ</button><button id="remove">ลบข้อมูลสมัครของ demo</button>
<p>การลบข้อมูล demo ไม่ยกเลิกการรับแจ้งเตือนของออเดอร์</p><p id="result" role="status"></p>
<a href="/staff">กลับหน้าพนักงาน</a></main></body></html>
