server:
  port: ${PORT:8080}

spring:
  application:
    name: queue-notify
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/queuenotify_restart}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Console mode is for local preview, not confirmation of browser delivery.
notification:
  mode: ${NOTIFICATION_MODE:console}

webpush:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:}
