server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: queue-notify
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/queuenotify}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate # โครงสร้างตารางคุมด้วย Flyway เท่านั้น ห้ามให้ Hibernate สร้างเอง
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

notification:
  line:
    access-token: ${LINE_ACCESS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true

webpush:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:}
# A deployment must explicitly provide this credential; no shared default password.
staff:
  username: ${STAFF_USERNAME:staff}
  password: ${STAFF_PASSWORD}
