name: Build and test
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript fixture suites
        shell: bash
        run: |
          set -euo pipefail
          for test in test/js/*.test.cjs; do
            node "$test"
          done
      - name: Maven and isolated PostgreSQL tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
